name: Build and Deploy company-frontend to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: tpc-deployments
  GAR_LOCATION: asia-south2
  REPOSITORY: tpc-deployments
  SERVICE: tpc-company-frontend
  REGION: asia-south2

jobs:
  deploy:
    permissions:
      contents: "read"
      id-token: "write"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS_TPC_DEPLOYMENTS }}"

      - name: Docker Auth
        id: docker-auth
        uses: "docker/login-action@v3"
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS_TPC_DEPLOYMENTS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container
        run: |-
          docker buildx build \
            --load \
            --build-arg NEXT_PUBLIC_FIREBASE_CLIENT_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_CLIENT_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_CLIENT_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_CLIENT_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_CLIENT_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_CLIENT_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_APP_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_CLIENT_MEASUREMENT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_MEASUREMENT_ID }}" \
            --build-arg NEXT_PUBLIC_AUTH_BACKEND="${{ secrets.NEXT_PUBLIC_AUTH_BACKEND }}" \
            --build-arg NEXT_PUBLIC_IAF_JAF_BACKEND="${{ secrets.NEXT_PUBLIC_IAF_JAF_BACKEND }}" \
            --build-arg NEXT_PUBLIC_EXAM_BACKEND="${{ secrets.NEXT_PUBLIC_EXAM_BACKEND }}" \
            --build-arg NEXT_PUBLIC_OPPORTUNITY_BACKEND="${{ secrets.NEXT_PUBLIC_OPPORTUNITY_BACKEND }}" \
            --build-arg NEXT_PUBLIC_RESUME_BACKEND="${{ secrets.NEXT_PUBLIC_RESUME_BACKEND }}" \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" \
            -f Dockerfile .
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: --allow-unauthenticated --port=8080

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
